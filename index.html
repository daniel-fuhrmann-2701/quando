<title>Quando</title>
<style>
  :root{--paper:#F4F2EC;--card:#fff;--ink:#1D1D1F;--ink2:#6B6A66;--line:#E3E0D7;--forest:#1F4D3A;--q:#2C6650;--signal:#F26B1D}
  @media (prefers-color-scheme:dark){:root{--paper:#121413;--card:#1D201E;--ink:#ECEAE4;--ink2:#A3A19B;--line:#2C302D;--q:#6CB894}}
  *{box-sizing:border-box}html,body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:grid;place-items:center;padding:24px}
  form{width:min(380px,100%);display:grid;gap:14px}
  .mark{font-weight:800;letter-spacing:-.05em;font-size:56px;line-height:.9;margin:0 0 4px}.mark span{color:var(--q)}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:-1px}
  p{margin:0 0 18px;color:var(--ink2);font-size:17px}
  input[type=password]{font:inherit;font-size:18px;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:inherit;outline:none}
  input[type=password]:focus{border-color:var(--q)}
  label{color:var(--ink2);font-size:15px;display:flex;gap:10px;align-items:center}
  button{font:inherit;font-size:17px;font-weight:650;min-height:56px;border:0;border-radius:999px;background:var(--signal);color:#1D1D1F;cursor:pointer}
  button:disabled{opacity:.5}#msg{color:#B4432F;min-height:1.2em;margin:0;font-size:15px}
</style></head>
<body>
<form id="f" method="post" action="#">

  <label><input id="remember" type="checkbox" checked> <span id="rem">Remember on this device</span></label>
  <button id="go">Unlock</button>
  <p id="msg" role="alert"></p>
</form>
